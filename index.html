<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050508">
    <title>SMART — Your Home, at Your Fingertips</title>
    <meta name="description" content="SMART: A spatial smart home control platform for Apple Vision Pro. Three interaction modes, modular hardware, and a dollhouse view of your entire home.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
:root {
    --bg: #050508;
    --text: #e8e8ec;
    --text-muted: #6b6b76;
    --accent: #818cf8;
    --accent-2: #a78bfa;
    --surface: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.06);
    --font-display: 'Syne', sans-serif;
    --font-body: 'Outfit', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); overflow-x: hidden; }

/* Grain overlay */
#grain {
    position: fixed; inset: 0; z-index: 200; pointer-events: none; opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
}

/* Canvas */
#webgl {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
}

/* ============ HERO ============ */
#hero {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: transparent; position: relative;
}
#hero::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 40%, transparent 0%, rgba(5,5,8,0.4) 50%, rgba(5,5,8,0.85) 100%);
}
.hero-content { position: relative; z-index: 1; }
.hero-label {
    font-family: var(--font-mono); font-size: 16px; letter-spacing: 6px;
    color: var(--accent); margin-bottom: 36px; opacity: 0;
}
.hero-title {
    font-family: var(--font-display); font-size: clamp(64px, 12vw, 160px);
    font-weight: 800; letter-spacing: -0.03em; line-height: 0.9;
    background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.5) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
}
.hero-title .split-char {
    display: inline-block; opacity: 0;
    background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.5) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.hero-subtitle {
    font-family: var(--font-body); font-weight: 300; font-size: clamp(26px, 3.5vw, 40px);
    color: var(--text-muted); margin-top: 32px; opacity: 0;
}
.hero-tags {
    display: flex; gap: 20px; justify-content: center; margin-top: 48px; opacity: 0;
}
.hero-tags span {
    font-family: var(--font-mono); font-size: 14px; letter-spacing: 3px;
    text-transform: uppercase; color: var(--text-muted);
    padding: 10px 24px; border: 1px solid var(--border); border-radius: 100px;
}
.scroll-hint {
    position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    z-index: 1; opacity: 0;
}
.scroll-hint span {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 3px;
    text-transform: uppercase; color: var(--text-muted);
}
.scroll-arrow {
    width: 1px; height: 32px; background: linear-gradient(180deg, var(--accent), transparent);
    animation: scrollBounce 2s ease-in-out infinite;
}
@keyframes scrollBounce {
    0%, 100% { transform: translateY(0); opacity: 0.5; }
    50% { transform: translateY(8px); opacity: 1; }
}
    </style>
</head>
<body>

<div id="grain"></div>
<canvas id="webgl"></canvas>

<section id="hero">
    <div class="hero-content">
        <div class="hero-label">SPATIAL SMART HOME PLATFORM</div>
        <h1 class="hero-title" data-split>SMART</h1>
        <p class="hero-subtitle">Your Home, at Your Fingertips</p>
        <div class="hero-tags">
            <span>Apple Vision Pro</span>
            <span>IoT</span>
            <span>Spatial Computing</span>
        </div>
    </div>
    <div class="scroll-hint">
        <span>Scroll to explore</span>
        <div class="scroll-arrow"></div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
    }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ============================================================
// THREE.JS SCENE
// ============================================================
const canvas = document.getElementById('webgl');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 1, 6);
camera.lookAt(0, 0.5, 0); // centered on AVP

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.3));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
keyLight.position.set(5, 8, 6);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x818cf8, 0.2);
rimLight.position.set(-5, 3, -5);
scene.add(rimLight);

// ============================================================
// MODEL HELPERS
// ============================================================
function normalize(m, size = 3) {
    const b = new THREE.Box3().setFromObject(m);
    const c = b.getCenter(new THREE.Vector3());
    const s = size / Math.max(...b.getSize(new THREE.Vector3()).toArray());
    m.scale.setScalar(s);
    m.position.set(-c.x * s, -c.y * s, -c.z * s);
    return m;
}

// ============================================================
// LOAD AVP MODEL
// ============================================================
const gltfLoader = new GLTFLoader();
let avpPivot = null;

async function loadAVP() {
    if (window.innerWidth < 768) return;
    try {
        const avp = await gltfLoader.loadAsync('assets/models/apple-vision-pro/source/AR-Code-1686060373323.glb');
        const avpMesh = normalize(avp.scene, 3);
        // Offset so rotation pivots around the screen/visor face
        const avpBox = new THREE.Box3().setFromObject(avpMesh);
        const avpDepth = avpBox.max.z - avpBox.min.z;
        avpMesh.position.z -= avpDepth * 0.45;
        // Wrap in pivot group
        avpPivot = new THREE.Group();
        avpPivot.add(avpMesh);
        avpPivot.position.set(-0.3, 0.5, 0);
        scene.add(avpPivot);
        console.log('AVP loaded');
    } catch (e) { console.warn('AVP load failed:', e); }
}

loadAVP();

// ============================================================
// HERO ENTRANCE ANIMATION
// ============================================================
function splitChars(el) {
    const text = el.textContent;
    el.innerHTML = '';
    const spans = [];
    [...text].forEach(char => {
        if (char === ' ') { el.appendChild(document.createTextNode(' ')); return; }
        const span = document.createElement('span');
        span.className = 'split-char';
        span.textContent = char;
        span.style.display = 'inline-block';
        el.appendChild(span);
        spans.push(span);
    });
    return spans;
}

const heroTitle = document.querySelector('.hero-title[data-split]');
const heroChars = splitChars(heroTitle);

// AVP spin-in: starts rotated away, spins to face camera
let avpSpinDone = false;
const avpSpinStart = -Math.PI * 0.8; // start rotated ~144° away
const avpSpinEnd = 0;

function startAVPSpin() {
    if (!avpPivot) return;
    avpPivot.rotation.y = avpSpinStart;
    gsap.to(avpPivot.rotation, {
        y: avpSpinEnd,
        duration: 1.8,
        ease: 'power3.out',
        onComplete: () => { avpSpinDone = true; }
    });
    // Fade in the AVP via scale
    avpPivot.scale.setScalar(0.6);
    gsap.to(avpPivot.scale, {
        x: 1, y: 1, z: 1,
        duration: 1.4,
        ease: 'power2.out',
    });
}

// Text entrance — delayed until after AVP spin begins
const entrance = gsap.timeline({ delay: 1.4 }); // wait for spin to mostly finish
entrance
    .fromTo(heroChars,
        { y: 50, opacity: 0, rotateX: -60 },
        { y: 0, opacity: 1, rotateX: 0, stagger: 0.06, duration: 0.8, ease: 'back.out(1.5)' }
    )
    .fromTo('.hero-label', { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6 }, '-=0.4')
    .fromTo('.hero-subtitle', { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6 }, '-=0.3')
    .fromTo('.hero-tags', { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6 }, '-=0.3')
    .fromTo('.scroll-hint', { opacity: 0 }, { opacity: 1, duration: 0.8 }, '-=0.2');

// Kick off AVP spin as soon as model loads (or immediately if already loaded)
function tryStartSpin() {
    if (avpPivot) { startAVPSpin(); }
    else { setTimeout(tryStartSpin, 100); }
}
setTimeout(tryStartSpin, 200);

// ============================================================
// RENDER LOOP
// ============================================================
function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}
animate();

// ============================================================
// RESIZE
// ============================================================
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
